name: .NET CI

on:
  push:
    branches: [ '**' ]        
  pull_request:
    branches: [ '**' ]        

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'  

    - name: Restore dependencies
      run: dotnet restore Planster_ModularMonolith.sln

    - name: Build
      run: dotnet build Planster_ModularMonolith.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test Planster_ModularMonolith.sln --no-build --configuration Release --logger "trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/*.trx'
